<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 300" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>Each image patch rotates two independent subspaces (RoPE, honest version)</title>
<desc>A scene is split into a 4x4 grid of patches. Each patch is split into two halves: the width half rotates by the column index, the height half rotates by the row index. The two halves rotate independently, so a patch at (row 1, col 3) looks different from (row 3, col 1) — they do not collide.</desc>
<style>
  .ts { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
  .pborder { fill: none; stroke: #2c2c2a; stroke-width: 1; opacity: 0.35; }
  .tint-w { fill: #185FA5; opacity: 0.16; }
  .tint-h { fill: #0F6E56; opacity: 0.16; }
  .sw-w { fill: #185FA5; } .sw-h { fill: #0F6E56; }
  @media (prefers-color-scheme: dark) {
    .ts { fill: #888780; }
    .pborder { stroke: #d3d1c7; opacity: 0.45; }
    .tint-w { fill: #B5D4F4; opacity: 0.20; } .tint-h { fill: #9FE1CB; opacity: 0.20; }
    .sw-w { fill: #B5D4F4; } .sw-h { fill: #9FE1CB; }
  }
  @media (prefers-reduced-motion: reduce) { animateTransform { display: none; } }
</style>
<defs>
  <g id="scene">
    <rect x="0" y="0" width="160" height="160" fill="#CDE8F6"/>
    <circle cx="124" cy="40" r="16" fill="#F4C842"/>
    <rect x="0" y="112" width="160" height="48" fill="#9CC36F"/>
    <polygon points="6,118 58,52 112,118" fill="#6E9B57"/>
    <polygon points="74,118 116,72 160,118" fill="#5C8348"/>
  </g>
  <clipPath id="cellL"><rect x="0"  y="0" width="20" height="40"/></clipPath>
  <clipPath id="cellR"><rect x="20" y="0" width="20" height="40"/></clipPath>
</defs>
<g transform="translate(260,70)">
  <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite"
    keyTimes="0;0.22;0.42;0.85;1" values="260,70;260,70;230,40;230,40;260,70"/>
  <g transform="rotate(0 10 20)">
    <animateTransform attributeName="transform" type="rotate" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.42;0.62;0.85;1" values="0 10 20;0 10 20;0 10 20;0 10 20;0 10 20"/>
    <g clip-path="url(#cellL)"><use href="#scene" transform="translate(0,0)"/></g>
    <rect class="tint-w" x="0" y="0" width="20" height="40"/>
    <rect class="pborder" x="0" y="0" width="20" height="40"/>
  </g>
  <g transform="rotate(0 30 20)">
    <animateTransform attributeName="transform" type="rotate" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.42;0.62;0.85;1" values="0 30 20;0 30 20;0 30 20;0 30 20;0 30 20"/>
    <g clip-path="url(#cellR)"><use href="#scene" transform="translate(0,0)"/></g>
    <rect class="tint-h" x="20" y="0" width="20" height="40"/>
