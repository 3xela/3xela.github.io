<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 1020" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>FluxDoubleStreamBlock forward pass</title>
<desc>Two parallel streams (img and txt) each get AdaLN modulation, separate QKV projections, then merge into a joint self-attention before splitting back into separate residual + MLP paths.</desc>
<style>
  .t   { font-size: 14px; font-weight: 400; fill: #2c2c2a; }
  .ts  { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
  .th  { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
  .arr      { stroke: #2c2c2a; stroke-width: 1.6; fill: none; }
  .arr-thin { stroke: #5f5e5a; stroke-width: 1;   fill: none; }
  .leader   { stroke: #888780; stroke-width: 0.8; stroke-dasharray: 4 3; fill: none; }
  .stream-bg { fill: none; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 2 4; opacity: 0.5; }
  .amber-fill  { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.5; }
  .amber-text  { fill: #633806; }
  .amber-sub   { fill: #854F0B; }
  .purple-fill { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .purple-text { fill: #3C3489; }
  .purple-sub  { fill: #534AB7; }
  .blue-fill   { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .blue-text   { fill: #0C447C; }
  .blue-sub    { fill: #185FA5; }
  .teal-fill   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .teal-text   { fill: #085041; }
  .teal-sub    { fill: #0F6E56; }
  .green-fill  { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.5; }
  .green-text  { fill: #27500A; }
  .green-sub   { fill: #3B6D11; }
  @media (prefers-color-scheme: dark) {
    .t   { fill: #d3d1c7; }
    .ts  { fill: #888780; }
    .th  { fill: #d3d1c7; }
    .arr      { stroke: #d3d1c7; }
    .arr-thin { stroke: #888780; }
    .leader   { stroke: #5f5e5a; }
    .stream-bg { stroke: #5f5e5a; opacity: 0.4; }
    .amber-fill  { fill: #633806; stroke: #FAC775; }
    .amber-text  { fill: #FAEEDA; }
    .amber-sub   { fill: #FAC775; }
    .purple-fill { fill: #3C3489; stroke: #CECBF6; }
    .purple-text { fill: #EEEDFE; }
    .purple-sub  { fill: #CECBF6; }
    .blue-fill   { fill: #0C447C; stroke: #B5D4F4; }
    .blue-text   { fill: #E6F1FB; }
    .blue-sub    { fill: #B5D4F4; }
    .teal-fill   { fill: #085041; stroke: #9FE1CB; }
    .teal-text   { fill: #E1F5EE; }
    .teal-sub    { fill: #9FE1CB; }
    .green-fill  { fill: #27500A; stroke: #C0DD97; }
    .green-text  { fill: #EAF3DE; }
    .green-sub   { fill: #C0DD97; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-thin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Stream channels -->
<rect class="stream-bg" x="80"  y="160" width="160" height="720" rx="12"/>
<rect class="stream-bg" x="440" y="160" width="160" height="720" rx="12"/>

<text class="th" x="160" y="30" text-anchor="middle">img</text>
<text class="ts" x="160" y="48" text-anchor="middle">(N_img, D)</text>
<text class="th" x="520" y="30" text-anchor="middle">txt</text>
<text class="ts" x="520" y="48" text-anchor="middle">(N_txt, D)</text>
<text class="th" x="340" y="30" text-anchor="middle">temb</text>
<text class="ts" x="340" y="48" text-anchor="middle">(D,)</text>

<!-- Main data arrows into norm1 -->
<line x1="160" y1="58" x2="160" y2="166" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="58" x2="520" y2="166" class="arr" marker-end="url(#arrow)"/>

<!-- temb into modulation (control) -->
<line x1="340" y1="58" x2="340" y2="76" class="arr-thin" marker-end="url(#arrow-thin)"/>

<rect class="amber-fill" x="250" y="80" width="180" height="56" rx="8"/>
<text class="th amber-text" x="340" y="100" text-anchor="middle" dominant-baseline="central">img_mod, txt_mod</text>
<text class="ts amber-sub"  x="340" y="120" text-anchor="middle" dominant-baseline="central">silu → Linear → 6 chunks</text>

<!-- One representative AdaLN leader on each side, going into a "spine" that touches each modulated step -->
<path class="leader" d="M 290 136 L 270 150 L 270 880"/>
<path class="leader" d="M 390 136 L 410 150 L 410 880"/>
<text class="ts" x="265" y="148" text-anchor="end" style="font-size:10px">shift, scale, gate ×2</text>
<text class="ts" x="415" y="148" text-anchor="start" style="font-size:10px">shift, scale, gate ×2</text>

<!-- Tick marks where AdaLN signals are injected -->
<line x1="265" y1="198" x2="275" y2="198" class="leader"/>
<line x1="265" y1="610" x2="275" y2="610" class="leader"/>
<line x1="265" y1="688" x2="275" y2="688" class="leader"/>
<line x1="265" y1="842" x2="275" y2="842" class="leader"/>
<line x1="405" y1="198" x2="415" y2="198" class="leader"/>
<line x1="405" y1="610" x2="415" y2="610" class="leader"/>
<line x1="405" y1="688" x2="415" y2="688" class="leader"/>
<line x1="405" y1="842" x2="415" y2="842" class="leader"/>

<rect class="purple-fill" x="80" y="170" width="160" height="56" rx="8"/>
<text class="th purple-text" x="160" y="190" text-anchor="middle" dominant-baseline="central">norm1 + modulate</text>
<text class="ts purple-sub"  x="160" y="210" text-anchor="middle" dominant-baseline="central">(1+scale)·LN(x) + shift</text>

<rect class="purple-fill" x="440" y="170" width="160" height="56" rx="8"/>
<text class="th purple-text" x="520" y="190" text-anchor="middle" dominant-baseline="central">norm1 + modulate</text>
<text class="ts purple-sub"  x="520" y="210" text-anchor="middle" dominant-baseline="central">(1+scale)·LN(x) + shift</text>

<line x1="160" y1="226" x2="160" y2="246" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="226" x2="520" y2="246" class="arr" marker-end="url(#arrow)"/>

<rect class="blue-fill" x="80" y="250" width="160" height="56" rx="8"/>
<text class="th blue-text" x="160" y="270" text-anchor="middle" dominant-baseline="central">img qkv + QKNorm</text>
<text class="ts blue-sub"  x="160" y="290" text-anchor="middle" dominant-baseline="central">(H, N_img, d_h) ×3</text>

<rect class="blue-fill" x="440" y="250" width="160" height="56" rx="8"/>
<text class="th blue-text" x="520" y="270" text-anchor="middle" dominant-baseline="central">txt qkv + QKNorm</text>
<text class="ts blue-sub"  x="520" y="290" text-anchor="middle" dominant-baseline="central">(H, N_txt, d_h) ×3</text>

<!-- Streams merge into joint attn -->
<path class="arr" d="M 160 306 L 160 330 L 280 330 L 280 346" marker-end="url(#arrow)"/>
<path class="arr" d="M 520 306 L 520 330 L 400 330 L 400 346" marker-end="url(#arrow)"/>

<rect class="teal-fill" x="220" y="350" width="240" height="56" rx="8"/>
<text class="th teal-text" x="340" y="370" text-anchor="middle" dominant-baseline="central">concat then RoPE(Q), RoPE(K)</text>
<text class="ts teal-sub"  x="340" y="390" text-anchor="middle" dominant-baseline="central">(H, N_txt+N_img, d_h)</text>

<line x1="340" y1="406" x2="340" y2="426" class="arr" marker-end="url(#arrow)"/>

<rect class="teal-fill" x="220" y="430" width="240" height="56" rx="8"/>
<text class="th teal-text" x="340" y="450" text-anchor="middle" dominant-baseline="central">joint scaled dot-prod attn</text>
<text class="ts teal-sub"  x="340" y="470" text-anchor="middle" dominant-baseline="central">cudnn flash kernel</text>

<!-- Split back -->
<path class="arr" d="M 340 486 L 340 506 L 160 506 L 160 516" marker-end="url(#arrow)"/>
<path class="arr" d="M 340 486 L 340 506 L 520 506 L 520 516" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="518" text-anchor="middle">split at N_txt</text>

<rect class="blue-fill" x="80" y="520" width="160" height="44" rx="8"/>
<text class="th blue-text" x="160" y="542" text-anchor="middle" dominant-baseline="central">img out_proj</text>

<rect class="blue-fill" x="440" y="520" width="160" height="44" rx="8"/>
<text class="th blue-text" x="520" y="542" text-anchor="middle" dominant-baseline="central">txt out_proj</text>

<line x1="160" y1="564" x2="160" y2="584" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="564" x2="520" y2="584" class="arr" marker-end="url(#arrow)"/>

<rect class="amber-fill" x="80" y="588" width="160" height="44" rx="8"/>
<text class="th amber-text" x="160" y="610" text-anchor="middle" dominant-baseline="central">img + gate_msa · attn</text>

<rect class="amber-fill" x="440" y="588" width="160" height="44" rx="8"/>
<text class="th amber-text" x="520" y="610" text-anchor="middle" dominant-baseline="central">txt + gate_msa · attn</text>

<line x1="160" y1="632" x2="160" y2="656" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="632" x2="520" y2="656" class="arr" marker-end="url(#arrow)"/>

<rect class="purple-fill" x="80" y="660" width="160" height="56" rx="8"/>
<text class="th purple-text" x="160" y="680" text-anchor="middle" dominant-baseline="central">norm2 + modulate</text>
<text class="ts purple-sub"  x="160" y="700" text-anchor="middle" dominant-baseline="central" style="font-size:10px">(1+scale_mlp)·LN + shift_mlp</text>

<rect class="purple-fill" x="440" y="660" width="160" height="56" rx="8"/>
<text class="th purple-text" x="520" y="680" text-anchor="middle" dominant-baseline="central">norm2 + modulate</text>
<text class="ts purple-sub"  x="520" y="700" text-anchor="middle" dominant-baseline="central" style="font-size:10px">(1+scale_mlp)·LN + shift_mlp</text>

<line x1="160" y1="716" x2="160" y2="736" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="716" x2="520" y2="736" class="arr" marker-end="url(#arrow)"/>

<rect class="green-fill" x="80" y="740" width="160" height="56" rx="8"/>
<text class="th green-text" x="160" y="760" text-anchor="middle" dominant-baseline="central">img_mlp</text>
<text class="ts green-sub"  x="160" y="780" text-anchor="middle" dominant-baseline="central">Linear → gelu → Linear</text>

<rect class="green-fill" x="440" y="740" width="160" height="56" rx="8"/>
<text class="th green-text" x="520" y="760" text-anchor="middle" dominant-baseline="central">txt_mlp</text>
<text class="ts green-sub"  x="520" y="780" text-anchor="middle" dominant-baseline="central">Linear → gelu → Linear</text>

<line x1="160" y1="796" x2="160" y2="816" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="796" x2="520" y2="816" class="arr" marker-end="url(#arrow)"/>

<rect class="amber-fill" x="80" y="820" width="160" height="44" rx="8"/>
<text class="th amber-text" x="160" y="842" text-anchor="middle" dominant-baseline="central">+ gate_mlp · mlp_out</text>

<rect class="amber-fill" x="440" y="820" width="160" height="44" rx="8"/>
<text class="th amber-text" x="520" y="842" text-anchor="middle" dominant-baseline="central">+ gate_mlp · mlp_out</text>

<line x1="160" y1="864" x2="160" y2="896" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="864" x2="520" y2="896" class="arr" marker-end="url(#arrow)"/>

<text class="th" x="160" y="920" text-anchor="middle">img out</text>
<text class="ts" x="160" y="938" text-anchor="middle">(N_img, D)</text>
<text class="th" x="520" y="920" text-anchor="middle">txt out</text>
<text class="ts" x="520" y="938" text-anchor="middle">(N_txt, D)</text>

<!-- Legend -->
<line x1="60"  y1="985" x2="100" y2="985" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="108"  y="985" dominant-baseline="central">data flow</text>
<line x1="200" y1="985" x2="240" y2="985" class="arr-thin" marker-end="url(#arrow-thin)"/>
<text class="ts" x="248" y="985" dominant-baseline="central">control (temb)</text>
<line x1="370" y1="985" x2="410" y2="985" class="leader"/>
<text class="ts" x="418" y="985" dominant-baseline="central">AdaLN signals (shift / scale / gate)</text>
</svg>
