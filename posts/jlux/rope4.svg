    values="260,60;260,60;245,45;245,45;260,60"/>
  <g><g clip-path="url(#cellL)"><use href="#scene" transform="translate(0,0)"/></g></g>
  <g><g clip-path="url(#cellR)"><use href="#scene" transform="translate(0,0)"/></g></g>
