<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neagoe.xyz</title>
    <meta name="description" content="sudo reboot" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <header class="wrap">
      <div class="py-10 header-content">
        <nav class="nav">
          <a class="link" href="/"><span>neagoe</span
            ><span class="text-muted">.</span><span>xyz</span></a
          >
          <a class="link nav-link" href="/blog.html">blog</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <span class="theme-toggle-text">🌙</span>
        </button>
      </div>
    </header>
    <main class="wrap">
      <div id="home-content"></div>
      <footer class="wrap">
        <div class="py-10">
          <a><span class="text-muted">Last updated</span
            ><span class="text-muted">: </span
            ><span class="text-muted">01 Feb 2025</span></a
          >
        </div>
      </footer>
    </main>
    <script>
      const homeContent = document.getElementById('home-content');

      // Wrap any (parenthetical) in muted styling, matching the original markup.
      function muteParens(s) {
        return s.replace(/\(([^)]*)\)/g, '<span class="text-muted">($1)</span>');
      }

      function renderInline(s) {
        return muteParens(marked.parseInline(s.trim()));
      }

      function renderListItem(text) {
        // Split a trailing " — date" off the item, if present.
        let main = text;
        let date = '';
        const idx = text.indexOf(' — ');
        if (idx !== -1) {
          main = text.slice(0, idx).trim();
          date = text.slice(idx + 3).trim();
        }
        const link = main.match(/^\[([^\]]*)\]\(([^)]+)\)$/);
        let body;
        if (link) {
          const label = muteParens(link[1]);
          const url = link[2];
          const target = /^https?:/.test(url) ? ' target="_blank" rel="noopener"' : '';
          body = `<a class="link primary inline-flex"${target} href="${url}"><span>${label}</span></a>`;
        } else {
          body = renderInline(main);
        }
        let html = '<li class="list-item">';
        html += '<span class="text-muted">﹂</span>';
        html += body;
        if (date) html += `<span class="text-muted text-xxxs">${date}</span>`;
        html += '</li>';
        return html;
      }

      function renderBody(lines) {
        let out = '';
        let para = [];
        let items = [];
        const flushPara = () => {
          if (para.length) {
            out += `<p>${renderInline(para.join(' '))}</p>`;
            para = [];
          }
        };
        const flushList = () => {
          if (items.length) {
            out += '<ul class="list">';
            items.forEach(it => { out += renderListItem(it); });
            out += '</ul>';
            items = [];
          }
        };
        lines.forEach(raw => {
          const line = raw.trim();
          if (!line) { flushPara(); return; }
          const li = line.match(/^[-*]\s+(.*)/);
          if (li) { flushPara(); items.push(li[1]); }
          else { flushList(); para.push(line); }
        });
        flushPara();
        flushList();
        return out;
      }

      function renderHome(md) {
        const sections = [];
        let cur = null;
        md.split('\n').forEach(line => {
          const h = line.match(/^##\s+(.*)/);
          if (h) {
            cur = { title: h[1].trim(), body: [] };
            sections.push(cur);
          } else if (cur) {
            cur.body.push(line);
          }
        });
        let html = '<div class="main-container">';
        sections.forEach(sec => {
          html += '<div class="intro">';
          html += `<p class="font-medium text-muted">${sec.title}</p>`;
          html += `<div class="body-text">${renderBody(sec.body)}</div>`;
          html += '</div>';
        });
        html += '</div>';
        return html;
      }

      async function loadHome() {
        const res = await fetch('home.md', { cache: 'no-store' });
        homeContent.innerHTML = renderHome(await res.text());
      }

      loadHome();
    </script>
  </body>
</html>
